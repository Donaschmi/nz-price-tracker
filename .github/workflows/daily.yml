name: Daily Price Tracker

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = ~08:00 Brussels time
  workflow_dispatch:        # run manually from the Actions tab any time

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python tracker.py

      - name: Commit updated prices and report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.db latest_report.md
          git diff --staged --quiet || git commit -m "chore: price snapshot $(date -u +%Y-%m-%d)"
          git push
